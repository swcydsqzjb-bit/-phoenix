name: PHOENIX Research

on:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Modeli yeniden eğit"
        required: true
        default: true
        type: boolean
      refresh:
        description: "Fiyat verisini yenile"
        required: true
        default: true
        type: boolean

  schedule:
    - cron: "30 15 * * 1-5"

permissions:
  contents: read

jobs:
  phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Repository dosyalarını al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: PHOENIX önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: |
            phoenix_cache
            phoenix_research_model.joblib
            phoenix_research_metrics.json
          key: phoenix-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            phoenix-${{ runner.os }}-

      - name: Gerekli paketleri yükle
        run: pip install -r requirements.txt

      - name: Çalıştırma seçeneklerini belirle
        id: flags
        shell: bash
        run: |
          FLAGS="--symbols symbols.csv --start 2018-01-01 --top 5"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            FLAGS="$FLAGS --refresh"
          else
            if [[ "${{ inputs.refresh }}" == "true" ]]; then
              FLAGS="$FLAGS --refresh"
            fi

            if [[ "${{ inputs.retrain }}" == "true" ]]; then
              FLAGS="$FLAGS --retrain"
            fi
          fi

          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: PHOENIX sistemini çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python phoenix_research.py ${{ steps.flags.outputs.flags }}

      - name: Sonuç dosyalarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-report-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            phoenix_research_predictions.csv
            phoenix_research_metrics.json
            phoenix_research_training.csv
